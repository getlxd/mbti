<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>天赋解码 · 职业定位测试</title>
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --accent: #7c5cfc;
    --accent2: #a78bfa;
    --accent3: #5cf2c0;
    --text: #e8e8f0;
    --text2: #a0a0c0;
    --border: #2a2a4a;
    --option: #22223a;
    --option-active: #7c5cfc;
    --gradient: linear-gradient(135deg, #7c5cfc 0%, #a78bfa 50%, #c4b5fd 100%);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }
  .app {
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    padding-bottom:80px;
  }
  /* ===== 通用页面 ===== */
  .page { display:none; animation:fade .4s ease; }
  .page.active { display:block; }
  @keyframes fade { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideIn { from{opacity:0;transform:translateX(16px)} to{opacity:1;transform:translateX(0)} }

  /* ===== 首页 ===== */
  .hero {
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:48px 24px 40px;
    text-align:center;
    background: radial-gradient(ellipse at top, #1e1b3a 0%, #0f0f1a 60%);
    overflow-y:auto;
  }
  .hero-logo {
    width:72px; height:72px;
    border-radius:20px;
    background: linear-gradient(135deg, #7c5cfc, #5cf2c0);
    display:flex; align-items:center; justify-content:center;
    font-size:32px;
    margin-bottom:20px;
    box-shadow:0 12px 40px rgba(124,92,252,.35);
  }
  .hero h1 {
    font-size:26px; font-weight:800; letter-spacing:1px;
    background:linear-gradient(135deg,#fff,#a78bfa);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    margin-bottom:6px;
  }
  .hero .hero-subtitle {
    font-size:13px; color:var(--accent2); font-weight:600;
    background:rgba(124,92,252,.12);
    padding:4px 14px; border-radius:20px;
    margin-bottom:10px;
  }
  .hero .theory-tag {
    font-size:11px; color:var(--text2);
    margin-bottom:24px;
  }
  .hero .subtitle { color:var(--text2); font-size:13px; line-height:1.7; max-width:320px; margin-bottom:28px; }

  /* 测试信息卡片 */
  .info-cards {
    display:flex; gap:10px; width:100%; max-width:340px; margin-bottom:28px;
  }
  .info-card {
    flex:1; background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:14px 8px; text-align:center;
  }
  .info-card .ic-icon { font-size:22px; margin-bottom:6px; }
  .info-card .ic-val { font-size:15px; font-weight:700; color:var(--text); }
  .info-card .ic-label { font-size:10px; color:var(--text2); margin-top:2px; }

  /* 十大天赋维度预览 */
  .dims-preview {
    width:100%; max-width:360px; margin-bottom:28px;
  }
  .dims-preview-title {
    font-size:14px; font-weight:700; color:var(--text);
    margin-bottom:12px; text-align:left;
  }
  .dims-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
  }
  .dim-mini-card {
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:10px 12px;
    display:flex; align-items:center; gap:8px;
  }
  .dim-mini-card .dm-icon { font-size:18px; }
  .dim-mini-card .dm-name { font-size:11px; color:var(--text2); font-weight:600; }

  .btn-primary {
    width:100%; max-width:340px;
    padding:16px;
    border:none; border-radius:14px;
    background:linear-gradient(135deg,#7c5cfc,#9d7cfc);
    color:#fff; font-size:16px; font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(124,92,252,.3);
    transition:transform .15s;
  }
  .btn-primary:active { transform:scale(.97); }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-secondary {
    width:100%; max-width:340px;
    padding:14px;
    border:1px solid var(--border); border-radius:14px;
    background:transparent;
    color:var(--text2); font-size:15px; font-weight:600;
    cursor:pointer;
    margin-top:12px;
    transition:all .15s;
  }
  .btn-secondary:active { transform:scale(.97); border-color:var(--accent); color:var(--text); }

  /* ===== 授权码页 ===== */
  .auth-page {
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:32px 24px;
    background: radial-gradient(ellipse at top, #1e1b3a 0%, #0f0f1a 60%);
  }
  .auth-box {
    width:100%; max-width:340px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:36px 28px;
    text-align:center;
  }
  .auth-box .auth-icon { font-size:40px; margin-bottom:16px; }
  .auth-box h2 { font-size:20px; margin-bottom:8px; }
  .auth-box .hint { color:var(--text2); font-size:13px; margin-bottom:24px; line-height:1.6; }
  .auth-input {
    width:100%; padding:14px 16px;
    border:2px solid var(--border); border-radius:12px;
    background:#12122a; color:var(--text);
    font-size:18px; text-align:center; letter-spacing:4px;
    outline:none; transition:border .2s;
  }
  .auth-input:focus { border-color:var(--accent); }
  .auth-input::placeholder { color:#4a4a6a; font-size:14px; letter-spacing:1px; }
  .auth-error { color:#ff6b6b; font-size:13px; margin-top:12px; min-height:18px; }
  .auth-btn { margin-top:20px; }
  .auth-footer {
    margin-top:24px; font-size:11px; color:#4a4a6a; line-height:1.6;
  }

  /* ===== 测试页 ===== */
  .test-header {
    position:sticky; top:0; z-index:10;
    padding:14px 20px 10px;
    background:rgba(15,15,26,.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .progress-bar { height:4px; background:var(--border); border-radius:2px; overflow:hidden; margin-bottom:8px; }
  .progress-fill { height:100%; background:linear-gradient(90deg,#7c5cfc,#5cf2c0); border-radius:2px; transition:width .3s; }
  .test-header-info { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--text2); }
  .question-container { padding:24px 20px; }
  .question {
    display:none;
    animation:slideIn .3s ease;
  }
  .question.active { display:block; }
  .q-text { font-size:18px; font-weight:600; line-height:1.5; margin-bottom:24px; }
  .options { display:flex; flex-direction:column; gap:10px; }
  .option {
    padding:16px 18px;
    background:var(--option);
    border:2px solid transparent;
    border-radius:14px;
    font-size:15px;
    cursor:pointer;
    transition:all .2s;
    display:flex; align-items:center; gap:12px;
  }
  .option:active { transform:scale(.98); }
  .option .opt-label {
    width:28px;height:28px; border-radius:50%;
    background:rgba(124,92,252,.15);
    color:var(--accent2);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;flex-shrink:0;
  }
  .option.selected {
    border-color:var(--accent);
    background:rgba(124,92,252,.12);
  }
  .option.selected .opt-label { background:var(--accent); color:#fff; }

  .nav-bar {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    display:flex; gap:12px;
    padding:14px 20px;
    padding-bottom:calc(14px + env(safe-area-inset-bottom));
    background:rgba(15,15,26,.95);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
  }
  .nav-btn {
    padding:13px 20px; border:none; border-radius:12px;
    font-size:15px; font-weight:600; cursor:pointer;
    transition:all .15s;
  }
  .nav-btn.prev { background:var(--option); color:var(--text2); flex:1; }
  .nav-btn.next { background:var(--accent); color:#fff; flex:2; }
  .nav-btn:disabled { opacity:.4; cursor:not-allowed; }
  .nav-btn:active:not(:disabled) { transform:scale(.96); }

  /* ===== 加载页 ===== */
  .loading-page {
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:32px;
  }
  .loading-circle {
    width:70px;height:70px;border-radius:50%;
    border:4px solid var(--border);
    border-top-color:var(--accent);
    animation:spin 0.8s linear infinite;
    margin-bottom:24px;
  }
  @keyframes spin { to{transform:rotate(360deg)} }
  .loading-text { color:var(--text2); font-size:14px; }
  .loading-sub { color:#4a4a6a; font-size:12px; margin-top:8px; }

  /* ===== 结果页 ===== */
  .result-page { padding:0 0 40px; }

  /* --- 结果首页 hero --- */
  .result-hero {
    padding:40px 24px 36px;
    text-align:center;
    background:radial-gradient(ellipse at top, #1e1b3a 0%, #0f0f1a 70%);
  }
  .result-label {
    font-size:13px; color:var(--text2);
    margin-bottom:12px; letter-spacing:2px;
  }
  .result-career-icon {
    font-size:56px; margin-bottom:12px;
  }
  .result-career-title {
    font-size:22px; font-weight:800;
    background:linear-gradient(135deg,#fff,#a78bfa);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    margin-bottom:6px;
    line-height:1.4;
  }
  .result-fit-badge {
    display:inline-block;
    padding:5px 14px; border-radius:16px;
    font-size:12px; font-weight:700;
    background:rgba(92,242,192,.15);
    color:var(--accent3);
    margin-bottom:4px;
  }
  .result-fit-pct {
    font-size:34px; font-weight:800; color:var(--accent3);
    margin:6px 0 2px;
  }
  .result-fit-label { font-size:11px; color:var(--text2); margin-bottom:18px; }

  /* 天赋类型卡片 - 紧跟在职业标题下方 */
  .type-card-main {
    display:inline-flex; flex-direction:column; align-items:center; gap:6px;
    padding:16px 28px; border-radius:16px;
    background:rgba(124,92,252,.08);
    border:1px solid rgba(124,92,252,.2);
    margin-bottom:12px;
  }
  .type-card-main .tcm-label { font-size:11px; color:var(--text2); letter-spacing:1px; }
  .type-card-main .tcm-name { font-size:18px; font-weight:800; color:var(--text); }
  .type-card-main .tcm-code { font-size:11px; color:var(--accent2); letter-spacing:2px; }
  .type-card-main .tcm-desc { font-size:12px; color:var(--text2); margin-top:4px; line-height:1.5; max-width:280px; }

  .scores-row {
    display:flex; justify-content:center; gap:24px;
    margin-top:14px; flex-wrap:wrap;
  }
  .score-item {
    text-align:center;
  }
  .score-item .score-val {
    font-size:20px; font-weight:800; color:var(--accent2);
  }
  .score-item .score-name {
    font-size:10px; color:var(--text2); margin-top:2px;
  }

  .scroll-hint {
    text-align:center; padding:16px 0 8px;
    font-size:12px; color:var(--text2);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

  /* --- 各 section --- */
  .result-section {
    padding:20px 24px;
    border-bottom:1px solid var(--border);
  }
  .result-section h3 {
    font-size:16px; margin-bottom:12px;
    display:flex; align-items:center; gap:8px;
  }
  .result-section h3 .ico { font-size:18px; }
  .result-section p, .result-section li {
    font-size:14px; line-height:1.7; color:var(--text2);
  }
  .result-section ul { list-style:none; padding:0; }
  .result-section ul li {
    padding:8px 0 8px 20px;
    position:relative;
  }
  .result-section ul li::before {
    content:'•'; position:absolute; left:0; color:var(--accent3);
  }

  /* 柱状图 */
  .bar-chart { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .bar-row { display:flex; align-items:center; gap:10px; }
  .bar-label { width:80px; font-size:12px; color:var(--text2); text-align:right; flex-shrink:0; }
  .bar-track { flex:1; height:18px; background:var(--border); border-radius:9px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:9px; transition:width 1s ease; }
  .bar-value { width:32px; font-size:12px; font-weight:600; flex-shrink:0; }

  /* 职业分类 */
  .career-intro {
    font-size:13px; color:var(--text2); margin-bottom:16px; line-height:1.6;
    padding:12px 14px; background:rgba(124,92,252,.06); border-radius:12px;
    border:1px solid rgba(124,92,252,.12);
  }
  .career-category {
    margin-bottom:18px;
    padding:16px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
  }
  .career-category:last-child { margin-bottom:0; }
  .cat-header {
    display:flex; align-items:center; gap:10px;
    margin-bottom:10px;
  }
  .cat-rank {
    width:24px;height:24px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;flex-shrink:0;
  }
  .cat-icon { font-size:22px; }
  .cat-info { flex:1; }
  .cat-name { font-size:15px; font-weight:700; color:var(--text); }
  .cat-pct {
    font-size:13px; font-weight:700;
    padding:3px 10px; border-radius:10px;
    background:rgba(92,242,192,.12);
    color:var(--accent3);
  }
  .cat-desc { font-size:12px; color:var(--text2); margin-bottom:10px; line-height:1.6; }
  .cat-jobs-title { font-size:11px; color:var(--text2); margin-bottom:6px; }
  .cat-jobs { display:flex; flex-wrap:wrap; gap:6px; }
  .cat-job {
    padding:5px 12px; border-radius:14px;
    font-size:12px; font-weight:600;
    background:rgba(124,92,252,.1);
    border:1px solid rgba(124,92,252,.25);
    color:var(--accent2);
  }

  .action-timeline { display:flex; flex-direction:column; gap:0; margin-top:8px; }
  .timeline-item {
    display:flex; gap:14px; padding-bottom:18px;
    position:relative;
  }
  .timeline-item::before {
    content:''; position:absolute; left:15px; top:30px; bottom:0;
    width:2px; background:var(--border);
  }
  .timeline-item:last-child::before { display:none; }
  .timeline-dot {
    width:32px;height:32px;border-radius:50%;
    background:var(--accent);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#fff;
    z-index:1;
  }
  .timeline-content h4 { font-size:14px; margin-bottom:4px; }
  .timeline-content p { font-size:13px; }

  .restart-btn { margin:24px 20px 0; }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ========== 首页 ========== -->
  <div class="page active" id="page-home">
    <div class="hero">
      <div class="hero-logo">✦</div>
      <h1>天赋解码</h1>
      <div class="hero-subtitle">职业深度版</div>
      <div class="theory-tag">基于多元智能 × 霍兰德职业兴趣理论</div>
      <p class="subtitle">发现你的独特天赋组合<br>精准定位最适合的职业方向</p>

      <!-- 测试信息 -->
      <div class="info-cards">
        <div class="info-card">
          <div class="ic-icon">⏱️</div>
          <div class="ic-val">8-10</div>
          <div class="ic-label">分钟完成</div>
        </div>
        <div class="info-card">
          <div class="ic-icon">📝</div>
          <div class="ic-val">45</div>
          <div class="ic-label">道精心题目</div>
        </div>
        <div class="info-card">
          <div class="ic-icon">🧬</div>
          <div class="ic-val">9</div>
          <div class="ic-label">天赋维度</div>
        </div>
      </div>

      <!-- 十大天赋维度预览 -->
      <div class="dims-preview">
        <div class="dims-preview-title">🧬 九大天赋维度</div>
        <div class="dims-grid">
          <div class="dim-mini-card"><span class="dm-icon">🔮</span><span class="dm-name">自我觉察</span></div>
          <div class="dim-mini-card"><span class="dm-icon">💞</span><span class="dm-name">人际共情</span></div>
          <div class="dim-mini-card"><span class="dm-icon">💡</span><span class="dm-name">创新创造</span></div>
          <div class="dim-mini-card"><span class="dm-icon">🎨</span><span class="dm-name">审美设计</span></div>
          <div class="dim-mini-card"><span class="dm-icon">🔢</span><span class="dm-name">逻辑分析</span></div>
          <div class="dim-mini-card"><span class="dm-icon">🌿</span><span class="dm-name">自然观察</span></div>
          <div class="dim-mini-card"><span class="dm-icon">🤸</span><span class="dm-name">身体动觉</span></div>
          <div class="dim-mini-card"><span class="dm-icon">🎵</span><span class="dm-name">音乐节奏</span></div>
          <div class="dim-mini-card"><span class="dm-icon">🗣️</span><span class="dm-name">语言辞令</span></div>
        </div>
      </div>

      <button class="btn-primary" onclick="startTest()">开始探索 →</button>
      <button class="btn-secondary" onclick="scrollHome()">了解更多</button>
    </div>
  </div>

  <!-- ========== 授权码页 ========== -->
  <div class="page" id="page-auth">
    <div class="auth-page">
      <div class="auth-box">
        <div class="auth-icon">🔑</div>
        <h2>授权验证</h2>
        <p class="hint">请输入您的授权码以开始测试<br>授权码区分大小写</p>
        <input class="auth-input" id="authCode" placeholder="请输入授权码" maxlength="12" autocomplete="off">
        <div class="auth-error" id="authError"></div>
        <button class="btn-primary auth-btn" onclick="checkAuth()">验证并进入</button>
        <div class="auth-footer">
          首次验证成功后自动保存<br>
          后续访问无需再次输入
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 测试页 ========== -->
  <div class="page" id="page-test">
    <div class="test-header">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="test-header-info">
        <span id="qIndex">1 / 45</span>
        <span id="qCategory"></span>
      </div>
    </div>
    <div class="question-container" id="questionContainer"></div>
    <div class="nav-bar">
      <button class="nav-btn prev" id="btnPrev" onclick="prevQ()" disabled>上一题</button>
      <button class="nav-btn next" id="btnNext" onclick="nextQ()">下一题</button>
    </div>
  </div>

  <!-- ========== 加载页 ========== -->
  <div class="page" id="page-loading">
    <div class="loading-page">
      <div class="loading-circle"></div>
      <p class="loading-text">正在分析你的天赋画像...</p>
      <p class="loading-sub">综合 9 维智能 + 职业兴趣匹配</p>
    </div>
  </div>

  <!-- ========== 结果页 ========== -->
  <div class="page" id="page-result">
    <div class="result-page" id="resultContent"></div>
    <button class="btn-primary restart-btn" onclick="restart()">重新测试</button>
    <button class="btn-secondary restart-btn" onclick="shareResult()">📤 分享结果</button>
  </div>

</div>

<script>
// ==================== 授权码 ====================
const VALID_CODES = ['TALENT25', 'GENIUS88', 'SPARK2025', 'BLOOM77'];
const AUTH_KEY = 'talent_auth_v3';

function checkAuth() {
  const input = document.getElementById('authCode').value.trim().toUpperCase();
  const errEl = document.getElementById('authError');
  if (!input) { errEl.textContent = '请输入授权码'; return; }
  if (VALID_CODES.includes(input)) {
    localStorage.setItem(AUTH_KEY, input);
    errEl.textContent = '';
    goPage('page-test');
    renderQuestion();
  } else {
    errEl.textContent = '授权码不正确，请重新输入';
  }
}

function startTest() {
  if (window.__skipAuth) {
    goPage('page-test');
  } else {
    goPage('page-auth');
  }
}

// ==================== 题目数据 ====================
// 维度：I=内省, P=人际, C=创造, A=美学, L=逻辑, N=自然, B=身体动觉, M=音乐, V=语言
const questions = [

// ==================== 页面切换 ====================
function goPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function scrollHome() {
  document.getElementById('page-home').scrollIntoView({ behavior:'smooth' });
}

// ==================== 渲染题目 ====================
function renderQuestion() {
  const container = document.getElementById('questionContainer');
  container.innerHTML = '';

  questions.forEach((q, idx) => {
    const qEl = document.createElement('div');
    qEl.className = 'question' + (idx === currentQ ? ' active' : '');
    qEl.id = 'q-' + idx;

    let optionsHtml = options.map(opt => `
      <div class="option ${answers[idx] === opt.label ? 'selected' : ''}" data-val="${opt.label}" onclick="selectOption(${idx},'${opt.label}')">
        <span class="opt-label">${opt.label}</span>
        <span>${opt.text}</span>
      </div>
    `).join('');

    qEl.innerHTML = `
      <div class="q-text">${idx+1}. ${q.text}</div>
      <div class="options">${optionsHtml}</div>
    `;
    container.appendChild(qEl);
  });

  updateNav();
}

function selectOption(qIdx, val) {
  answers[qIdx] = val;
  const qEl = document.getElementById('q-' + qIdx);
  qEl.querySelectorAll('.option').forEach(el => {
    el.classList.toggle('selected', el.dataset.val === val);
  });
  // 自动跳转下一题
  setTimeout(() => {
    if (currentQ < questions.length - 1) {
      currentQ++;
      showQuestion(currentQ);
    } else {
      updateNav();
    }
  }, 350);
}

function showQuestion(idx) {
  document.querySelectorAll('.question').forEach(el => el.classList.remove('active'));
  document.getElementById('q-' + idx).classList.add('active');
  currentQ = idx;
  updateNav();
  window.scrollTo(0,0);
}

function updateNav() {
  const total = questions.length;
  document.getElementById('qIndex').textContent = `${currentQ+1} / ${total}`;
  // 不显示当前题目所属维度标签给用户
  document.getElementById('qCategory').textContent = '';
  const pct = (currentQ / (total - 1)) * 100;
  document.getElementById('progressFill').style = `width:${pct}%`;

  document.getElementById('btnPrev').disabled = currentQ === 0;
  const answered = answers[currentQ] !== undefined;
  const btnNext = document.getElementById('btnNext');
  if (currentQ === total - 1) {
    btnNext.textContent = answered ? '查看结果 →' : '请选择答案';
    btnNext.disabled = !answered;
  } else {
    btnNext.textContent = '下一题';
    btnNext.disabled = !answered;
  }
}

function prevQ() {
  if (currentQ > 0) { currentQ--; showQuestion(currentQ); }
}
function nextQ() {
  if (answers[currentQ] === undefined) return;
  if (currentQ === questions.length - 1) {
    submitTest();
  } else {
    currentQ++;
    showQuestion(currentQ);
  }
}

// ==================== 提交 & 计分 ====================
function submitTest() {
  const dims = { I:0, P:0, C:0, A:0, L:0, N:0, B:0, M:0, V:0 };
  questions.forEach((q, idx) => {
    if (answers[idx]) dims[q.dim] += scoreMap[answers[idx]];
  });

  // 归一化到20分制
  const norm = {};
  for (const k in dims) norm[k] = Math.round(dims[k] / 25 * 20);

  generateResult(norm);
  goPage('page-loading');
  setTimeout(() => goPage('page-result'), 1800);
}

  B:'动手能力强，在行动中学习和创造。',
  M:'对节奏和声音敏感，能用音乐表达情感。',
  V:'语言表达精准生动，善于说服与叙事。',
};

const weaknessMap = {
  I:'可能过度内省导致内耗，与快节奏环境不同步。',
  P:'容易过度共情而忽略自己的需求，边界感偏弱。',
  C:'点子多但执行力不足，容易"想多做少"。',
  A:'可能过于追求完美美感而影响效率。',
  L:'过度理性可能忽略人情因素，沟通偏冷。',
  N:'细节导向可能忽略全局，决策偏慢。',
  B:'不喜欢久坐和文书工作，结构化表达有挑战。',
  M:'艺术气质浓，商业思维可能偏弱。',
  V:'善辩但可能"说服大于倾听"，需平衡表达与接收。',
};

function getSynergyTip(top3) {
  const tips = {
    'C-I':'将创造力与内省力结合：每个创意先过一遍"内心验证"，让点子更有深度。',
    'C-P':'创意+共情=最好的用户视角。你的方案天然站在人的需求上，适合做用户导向的创新。',
    'L-C':'逻辑为创造提供结构。用系统思维让创意可复制、可规模化。',
    'A-C':'美学+创造是设计创新的核心组合。你的作品既有美感又有突破性。',
    'P-I':'共情+内省让你成为团队的"情绪锚点"，适合做 leadership 和 coaching。',
    'V-L':'语言+逻辑是说服力的黄金组合，适合咨询、写作、演讲等需要"以理服人"的领域。',
    'B-C':'动手+创造=从想法到实物的最短路径。你适合做原型、MVP、快速验证。',
    'N-L':'观察+逻辑是科学研究的基础。你擅长从现象中发现规律。',
    'M-A':'音乐+美学是多媒体艺术的核心。你在声音视觉融合领域有独特优势。',
    'V-P':'语言+人际=影响力放大器。你天生适合做沟通型、领导型角色。',
  };
  const key = top3.slice(0,2).map(t=>t[0]).join('-');
  return tips[key] || '你的天赋组合具有独特性，建议在学习与工作中主动寻找不同维度之间的交叉点，往往创新就发生在学科/能力的交界处。';
}

// ==================== 主渲染 ====================
function generateResult(norm) {
  const top3 = getTopDims(norm);
  const type = getTalentType(top3);
  const categories = getCareerCategories(type.name, norm, top3);
  const best = getBestCareerTitle(categories);
  const totalScore = top3.reduce((s,t) => s+t[1], 0);

  // 霍兰德
  const hollandMap = { I:'I', P:'S', C:'A', A:'A', L:'I', N:'R', B:'R', M:'A', V:'E' };
  const hollandCode = top3.slice(0,3).map(t => hollandMap[t[0]]).join('');

  lastResult = { type, categories, best, totalScore, top3, norm, hollandCode };

  // 柱状图
  const sortedDims = Object.entries(norm).sort((a,b) => b[1]-a[1]);
  const barsHtml = sortedDims.map(([dim, val]) => `
    <div class="bar-row">
      <div class="bar-label">${dimNames[dim]}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:0; background:${dimColors[dim]}" data-w="${val*5}"></div>
      </div>
      <div class="bar-value">${val}</div>
    </div>
  `).join('');

  // 核心能力分数（top3维度）
  const scoresRowHtml = top3.slice(0, 3).map(([dim, val]) => `
    <div class="score-item">
      <div class="score-val">${val}</div>
      <div class="score-name">${dimNames[dim]}</div>
    </div>
  `).join('');

  // 职业大类卡片
  const catHtml = categories.map((cat, idx) => `
    <div class="career-category">
      <div class="cat-header">
        <div class="cat-rank">${idx+1}</div>
        <span class="cat-icon">${cat.icon}</span>
        <div class="cat-info">
          <div class="cat-name">${cat.name}</div>
        </div>
        <span class="cat-pct">匹配率 ${cat.fitPct}%</span>
      </div>
      <div class="cat-desc">${cat.desc}</div>
      <div class="cat-jobs-title">📋 可优先探索的具体岗位：</div>
      <div class="cat-jobs">
        ${cat.jobs.slice(0, 8).map(job => `<span class="cat-job">${job}</span>`).join('')}
      </div>
    </div>
  `).join('');

  const strengthHtml = top3.map(([dim]) => `<li>${strengthMap[dim]}</li>`).join('');
  const weaknessHtml = top3.map(([dim]) => `<li>${weaknessMap[dim]}</li>`).join('');

  const resultEl = document.getElementById('resultContent');
  resultEl.innerHTML = `
    <!-- ===== 结果首页：最适合的职业大类（参考图片风格） ===== -->
    <div class="result-hero">
      <div class="result-label">🎯 你最适合的职业方向</div>
      <div class="result-career-icon">${best.icon}</div>
      <div class="result-career-title">${best.title}</div>
      <div class="result-fit-badge">🏆 最优匹配</div>
      <div class="result-fit-pct">${best.fitPct}%</div>
      <div class="result-fit-label">综合契合度</div>

      <div style="width:60px;height:2px;background:var(--border);margin:4px auto 16px;"></div>

      <!-- 天赋类型卡片（紧跟职业下方） -->
      <div class="type-card-main">
        <span class="tcm-label">你的天赋类型</span>
        <span class="tcm-name">${type.name}</span>
        <span class="tcm-code">${type.code}</span>
        <span class="tcm-desc">${type.desc}</span>
      </div>

      <div class="scores-row">
        ${scoresRowHtml}
      </div>
    </div>

    <div class="scroll-hint">↓ 下滑查看完整天赋图谱与职业方向</div>

    <!-- ===== 天赋类型解读（最先展示） ===== -->
    <div class="result-section">
      <h3><span class="ico">✨</span> 天赋类型解读</h3>
      <p style="margin-bottom:14px;font-size:14px;line-height:1.7">${type.desc}</p>
      <h4 style="font-size:14px;margin-bottom:8px;color:var(--text)">🌟 你的核心优势</h4>
      <ul>${strengthHtml}</ul>
      <h4 style="font-size:14px;margin:14px 0 8px;color:var(--text)">⚠️ 可能的卡点</h4>
      <ul>${weaknessHtml}</ul>
    </div>

    <!-- ===== 天赋图谱 ===== -->
    <div class="result-section">
      <h3><span class="ico">📊</span> 天赋能力图谱</h3>
      <div class="bar-chart">${barsHtml}</div>
    </div>

    <!-- ===== 霍兰德代码 ===== -->
    <div class="result-section">
      <h3><span class="ico">🔬</span> 霍兰德职业兴趣</h3>
      <p style="margin-bottom:8px">你的职业兴趣代码：<strong style="color:var(--accent2);font-size:16px">${hollandCode}</strong></p>
      <p style="font-size:13px">该代码代表你在职业选择中更偏好：<span style="color:var(--text)">${getHollandDesc(hollandCode)}</span></p>
    </div>

    <!-- ===== 职业方向（放到后面） ===== -->
    <div class="result-section">
      <h3><span class="ico">🗂️</span> 可优先探索的职业方向</h3>
      <div class="career-intro">
        根据你的天赋画像，以下 <strong style="color:var(--accent2)">${categories.length}</strong> 个职业大类与你的能力结构最为匹配，按匹配率从高到低排列。每个大类下附有具体岗位参考。
      </div>
      ${catHtml}
    </div>

    <!-- ===== 成长行动计划 ===== -->
    <div class="result-section">
      <h3><span class="ico">🚀</span> 成长行动计划</h3>
      <div class="action-timeline">
        <div class="timeline-item">
          <div class="timeline-dot">1</div>
          <div class="timeline-content">
            <h4>短期（1个月内）</h4>
            <p>围绕核心天赋（${dimNames[top3[0][0]]}），完成一次小范围实践或作品输出，验证天赋直觉。</p>
          </div>
        </div>
        <div class="timeline-item">
          <div class="timeline-dot">3</div>
          <div class="timeline-content">
            <h4>中期（3-6个月）</h4>
            <p>在"${categories[0].name}"或"${categories[1].name}"方向中，找1-2个具体岗位做深度探索、访谈或实习体验。</p>
          </div>
        </div>
        <div class="timeline-item">
          <div class="timeline-dot">12</div>
          <div class="timeline-content">
            <h4>长期（1年+）</h4>
            <p>建立"天赋-职业"的正向飞轮：持续精进核心能力，同时补足短板维度，形成独特的复合竞争力。</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== 天赋协同建议 ===== -->
    <div class="result-section">
      <h3><span class="ico">💡</span> 天赋协同建议</h3>
      <p>${getSynergyTip(top3)}</p>
    </div>
  `;

  // 柱状图动画
  setTimeout(() => {
    document.querySelectorAll('.bar-fill').forEach(el => {
      el.style.width = el.dataset.w + '%';
    });
  }, 200);
}

function getHollandDesc(code) {
  const map = {
    'R':'实操动手、具体任务','I':'思考研究、分析探索','A':'艺术创造、自由表达',
    'S':'服务助人、人际互动','E':'领导影响、商业成就','C':'秩序规范、精细执行'
  };
  return code.split('').map(c => map[c] || '').filter(Boolean).join(' / ') || '多元均衡';
}

function shareResult() {
  if (!lastResult) return;
  const { type, best } = lastResult;
  const text = `我的天赋类型是「${type.name}」，最适合的职业方向是：${best.title}（匹配率${best.fitPct}%）

来测测你的 →`;
  if (navigator.share) {
    navigator.share({ title:'天赋职业测试', text }).catch(()=>{});
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); alert('结果已复制到剪贴板，快去分享吧！'); }
    catch(e) { alert(text); }
    document.body.removeChild(ta);
  }
}

// ==================== 重新测试 ====================
function restart() {
  currentQ = 0;
  answers = {};
  lastResult = null;
  renderQuestion();
  goPage('page-home');
}

// ==================== 初始化 ====================
(function init() {
  const saved = localStorage.getItem(AUTH_KEY);
  if (saved) {
    window.__skipAuth = true;
  }
  renderQuestion();
})();
</script>
</body>
</html>
