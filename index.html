<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>16Personalities · MBTI 性格测试</title>
<style>
:root{
  --bg1:#0f172a; --bg2:#1e293b; --accent:#06b6d4; --accent2:#6366f1;
  --card:rgba(255,255,255,.08); --line:rgba(255,255,255,.14);
  --text:#f1f5f9; --muted:#94a3b8; --e:#f59e0b; --i:#6366f1; --s:#10b981;
  --n:#8b5cf6; --t:#ef4444; --f:#ec4899; --j:#3b82f6; --p:#f97316;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);min-height:100vh;overflow-x:hidden;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  background-attachment:fixed;line-height:1.7;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(circle at 15% 20%,rgba(99,102,241,.25),transparent 40%),
    radial-gradient(circle at 85% 75%,rgba(6,182,212,.22),transparent 42%);
  pointer-events:none;
}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px 16px 60px;}
.brand{text-align:center;padding:14px 0 6px;}
.brand .logo{
  display:inline-block;font-weight:800;font-size:26px;letter-spacing:1px;
  background:linear-gradient(90deg,#22d3ee,#818cf8);-webkit-background-clip:text;
  background-clip:text;color:transparent;
}
.brand .ver{font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:2px;}

/* 卡片 */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:22px;margin-top:16px;backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);box-shadow:0 8px 32px rgba(0,0,0,.25);
}
h1{font-size:23px;text-align:center;margin-bottom:8px;}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:6px;}

/* 维度介绍卡片 */
.dim-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.dim{
  border-radius:14px;padding:14px 12px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);
}
.dim .top{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:6px;}
.dot{width:12px;height:12px;border-radius:50%;flex:none;}
.dim p{font-size:11px;color:var(--muted);line-height:1.55;}
.dim .pair{font-size:10px;opacity:.8;margin-top:6px;letter-spacing:.5px;}

.section-title{font-size:16px;font-weight:800;margin:22px 2px 4px;display:flex;align-items:center;gap:8px;}
.section-title span{font-size:11px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.08);padding:2px 8px;border-radius:8px;}

/* 测试入口卡 */
.entry{display:flex;gap:12px;margin-top:14px;}
.entry .opt{
  flex:1;border-radius:18px;padding:18px 14px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);text-align:center;cursor:pointer;transition:.2s;position:relative;overflow:hidden;
}
.entry .opt.primary{border-color:rgba(6,182,212,.55);}
.entry .opt.full{border-color:rgba(139,92,246,.5);}

/* 精简首页 */
.hero{text-align:center;padding:8px 0 4px;}
.hero h1{font-size:22px;margin-bottom:8px;}
.hero .sub{font-size:13px;max-width:380px;margin:0 auto;}
.entry-wrap{margin-top:18px;}
.entry-wrap .entry{flex-direction:column;gap:14px;}
.entry-wrap .opt{display:flex;align-items:center;text-align:left;padding:18px 20px;gap:16px;}
.entry-wrap .opt .ill{font-size:38px;margin:0 4px 0 0;flex:none;}
.entry-wrap .opt .txt{flex:1;}
.entry-wrap .opt .tt{font-size:16px;}
.entry-wrap .opt .num{font-size:12px;margin-top:2px;}
.entry-wrap .opt .time{font-size:11px;margin-top:2px;}
.entry-wrap .opt .arrow{flex:none;font-size:22px;opacity:.6;transition:.2s;}
.entry-wrap .opt:active .arrow{transform:translateX(4px);opacity:1;}
.intro-note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6;}

/* 折叠说明块 */
.collapse{margin-top:16px;}
.collapse summary{cursor:pointer;list-style:none;font-size:14px;font-weight:700;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.collapse summary::-webkit-details-marker{display:none;}
.collapse summary .ic{transition:.25s;font-size:12px;opacity:.6;}
.collapse[open] summary .ic{transform:rotate(180deg);}
.collapse .cbody{padding:6px 2px 2px;}

/* 海报 */
.poster{position:relative;border-radius:22px;padding:26px 22px 22px;color:#fff;overflow:hidden;
  background:linear-gradient(160deg,#0f172a,#1e293b 55%,#0b3b4b);margin-bottom:18px;}
.poster::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 12%,rgba(99,102,241,.45),transparent 42%),radial-gradient(circle at 12% 88%,rgba(6,182,212,.35),transparent 42%);pointer-events:none;}
.poster>*{position:relative;z-index:1;}
.poster .plogo{font-weight:800;font-size:13px;letter-spacing:2px;opacity:.85;}
.poster .pcode{font-size:44px;font-weight:900;letter-spacing:3px;margin:14px 0 2px;background:linear-gradient(90deg,#22d3ee,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent;}
.poster .pname{font-size:18px;font-weight:700;}
.poster .prole{font-size:12px;opacity:.85;margin-top:4px;}
.poster .pdim{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
.poster .pdim span{font-size:11px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:10px;font-weight:600;}
.poster .pbars{margin-top:16px;}
.poster .pbar{display:flex;align-items:center;gap:8px;font-size:10px;margin-bottom:7px;}
.poster .pbar .pl{width:52px;opacity:.9;}
.poster .pbar .pr{width:52px;text-align:right;opacity:.9;}
.poster .pbar .pt{flex:1;height:8px;background:rgba(255,255,255,.14);border-radius:8px;overflow:hidden;display:flex;}
.poster .pbar .pt i{display:block;height:100%;}
.poster .pfoot{margin-top:16px;font-size:10px;opacity:.75;text-align:center;border-top:1px solid rgba(255,255,255,.16);padding-top:10px;}
.share-row{display:flex;gap:12px;margin-top:18px;}
.share-row .btn{margin-top:0;}
.entry .opt.disabled{opacity:.55;filter:grayscale(.6);}
.entry .opt .ill{font-size:34px;margin-bottom:8px;}
.entry .opt .tt{font-weight:800;font-size:14px;}
.entry .opt .num{font-size:11px;color:var(--accent);margin-top:3px;}
.entry .opt .time{font-size:10px;color:var(--muted);margin-top:2px;}
.entry .opt .soon{position:absolute;top:10px;right:-22px;background:var(--accent2);font-size:9px;padding:2px 22px;transform:rotate(35deg);}
.entry .opt:active{transform:scale(.97);}

/* 结果分类 */
.type-group{margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);}
.type-group .gh{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:13px;}
.type-group .gh .tag{font-size:10px;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:8px;}
.type-group ul{list-style:none;padding:4px 14px 12px;font-size:12px;color:var(--muted);}
.type-group li{padding:3px 0;padding-left:16px;position:relative;}
.type-group li::before{content:"";position:absolute;left:2px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--accent);}

/* 按钮 */
.btn{
  display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:15px;
  font-weight:700;color:#04121a;cursor:pointer;margin-top:16px;
  background:linear-gradient(90deg,#22d3ee,#6366f1);letter-spacing:1px;transition:.2s;
}
.btn:active{transform:scale(.98);}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);}
.agree{display:flex;align-items:flex-start;gap:8px;font-size:11px;color:var(--muted);margin-top:14px;line-height:1.5;}
.agree input{margin-top:2px;accent-color:var(--accent);}
.note{font-size:10px;color:var(--muted);text-align:center;margin-top:12px;opacity:.8;}

/* 授权码弹层 */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(4,12,28,.72);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:24px;}
.overlay.show{display:flex;}
.auth-box{background:#122033;border:1px solid var(--line);border-radius:22px;padding:26px 22px;width:100%;max-width:360px;}
.auth-box h3{text-align:center;margin-bottom:6px;}
.auth-box p{text-align:center;color:var(--muted);font-size:12px;margin-bottom:16px;}
.auth-box input{
  width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.06);color:var(--text);font-size:15px;text-align:center;letter-spacing:2px;outline:none;
}
.auth-box .err{color:#f87171;font-size:12px;text-align:center;margin-top:10px;min-height:18px;}

/* 答题页 */
.quiz-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.quiz-head .back{background:rgba(255,255,255,.08);border:none;color:var(--text);width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;}
.progress{height:7px;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden;margin:10px 0 4px;}
.progress .bar{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#818cf8);transition:width .3s;}
.qmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:14px;}
.qtext{font-size:17px;font-weight:700;line-height:1.6;margin:8px 0 20px;}
.opt-btn{
  display:block;width:100%;text-align:left;padding:16px 18px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);
  font-size:14px;margin-bottom:12px;cursor:pointer;transition:.18s;
}
.opt-btn .key{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:7px;background:rgba(255,255,255,.1);font-size:12px;margin-right:10px;font-weight:700;}
.opt-btn.sel{border-color:var(--accent);background:rgba(6,182,212,.16);transform:translateX(3px);}
.nav{display:flex;gap:10px;margin-top:8px;}
.nav .btn{margin-top:0;}

/* 结果页 */
.result-type{text-align:center;margin:4px 0 6px;}
.result-type .code{font-size:38px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(90deg,#22d3ee,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent;}
.result-type .name{font-size:16px;font-weight:700;margin-top:2px;}
.result-type .role{font-size:12px;color:var(--muted);margin-top:2px;}
.bars{margin:18px 0;}
.bars .row{margin-bottom:14px;}
.bars .lab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
.bars .track{display:flex;height:14px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.08);}
.bars .seg{flex:1;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#04121a;transition:flex .5s;}
.seg.a{background:var(--accent);}
.seg.b{background:rgba(255,255,255,.16);color:var(--muted);}
.info-block{margin-top:14px;}
.info-block h4{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.info-block p,.info-block ul{font-size:13px;color:#cbd5e1;}
.info-block ul{list-style:none;padding-left:0;}
.info-block li{padding:4px 0 4px 18px;position:relative;}
.info-block li::before{content:"▸";position:absolute;left:0;color:var(--accent);}
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px;}
.chip{font-size:12px;background:rgba(99,102,241,.2);border:1px solid rgba(129,140,248,.4);padding:5px 12px;border-radius:20px;}
.share-row{display:flex;gap:10px;margin-top:18px;}
.share-row .btn{margin-top:0;}
.share-row .ghost{flex:1;}
.share-row .primary{flex:2;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid2 .info-block{margin-top:0;}
.grow{background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(6,182,212,.1));border:1px solid rgba(129,140,248,.3);border-radius:16px;padding:16px;}
.bars-title{font-size:13px;font-weight:700;margin:8px 2px 4px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.info-block ul{margin-top:2px;}
.foot{text-align:center;color:var(--muted);font-size:10px;margin-top:18px;line-height:1.6;}

.hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- 授权码弹层 -->
<div class="overlay" id="authOverlay">
  <div class="card auth-box">
    <h3>🔒 输入授权码</h3>
    <p id="authDesc">请输入授权码以进入测试</p>
    <input id="authInput" type="password" placeholder="授权码" autocomplete="off">
    <button class="btn" onclick="submitAuth()">确 认</button>
    <div class="err" id="authErr"></div>
  </div>
</div>

<script>
/* ============ 配置 ============
   【授权码说明 · 用于销售】
   - CODES 里每一条是一个可销售的授权码，每条带 quota（可使用次数，null = 不限次数）
     和 allow（允许进入的版本：standard=标准版96 / full=完整版200 / all=两者皆可）
   - 用户使用某码进入后，该码计数 +1；达到 quota 上限则失效
   - 每个授权码只需输入一次：通过后会在本机 localStorage 记录"已授权"，后续直接进入
     （清浏览器数据 / 换设备需重新输入）
   - 想新增/下架码，只需增删 CODES 数组即可；建议正式上线后把 CODES 放到后端校验，
     当前为纯前端演示，码明文可见，仅适合小规模分发 */
const CODES = [
  { code: "M8K3X9", quota: null, allow: "standard", label: "标准版 · 96题" }, // 销售码A
  { code: "P2QR7L", quota: null, allow: "standard", label: "标准版 · 96题" }, // 销售码B
  { code: "V5NJ4W", quota: null, allow: "full",      label: "完整版 · 200题" }, // 销售码C
  { code: "T9HX6B", quota: null, allow: "all",       label: "全版本通用" },      // 销售码D（通用）
];
const STORAGE_KEY = "mbti_authed_v2";

/* ============ 题目数据 ============
   按文档答案口径：每题 {a, b}，A 恒为"外向/感觉/思考/判断"侧，B 为对立侧。
   计分口径（严谨版）：每 8 题为一个完整轮次，依次对应
     E/I、S/N、T/F、J/P 各 1 题（A=正向，B=对立），循环往复。
   200 题 = 25 轮，故 E/I/S/N/T/F/J/P 每维度【恰好各 25 题】，计分完全均衡；
   标准版取前 96 题 = 12 轮，每维度也恰好各 12 题。 */
function dimOf(index){
  const dims = [{a:"E",b:"I"},{a:"S",b:"N"},{a:"T",b:"F"},{a:"J",b:"P"}];
  return dims[Math.floor((index % 8) / 2) % 4]; // 0,1->E/I ; 2,3->S/N ; 4,5->T/F ; 6,7->J/P
}
const QUESTIONS = Array.from({length:200}, (_, i)=> dimOf(i));

/* ---------- 授权码（多码 · 销售 · 次数计数） ---------- */
const overlay = document.getElementById("authOverlay");
const USAGE_KEY = "mbti_code_usage_v1"; // 记录每个码已用次数

function getUsage(){ try{return JSON.parse(localStorage.getItem(USAGE_KEY))||{};}catch(e){return{};} }
function setUsage(u){ localStorage.setItem(USAGE_KEY, JSON.stringify(u)); }

/* 校验授权码：返回 {ok, msg, code}
   - 码存在 & (allow 匹配本版本 或 "all") & 未超 quota => 通过 */
function verifyCode(raw, kind){
  const v = String(raw).trim().toUpperCase();
  const found = CODES.find(c => c.code === v);
  if(!found) return {ok:false, msg:"授权码无效，请核对后重试"};
  if(found.allow !== "all" && found.allow !== kind){
    return {ok:false, msg: found.allow==="standard" ? "该码仅用于标准版（96题）" : "该码仅用于完整版（200题）" };
  }
  if(found.quota != null){
    const used = (getUsage()[v])||0;
    if(used >= found.quota) return {ok:false, msg:"该授权码已达使用上限"};
  }
  return {ok:true, code:v};
}

function showAuth(kind){
  mode = kind;
  const verTxt = {standard:"标准版 · 96 题", full:"完整版 · 200 题"}[kind];
  document.getElementById("authDesc").innerHTML =
    `正在进入 <b>${verTxt}</b><br><span style="font-size:11px;opacity:.75">请输入有效的授权码（每个码仅需输入一次）</span>`;
  document.getElementById("authErr").textContent = "";
  document.getElementById("authInput").value = "";
  overlay.classList.add("show");
  setTimeout(()=>document.getElementById("authInput").focus(),100);
}
function submitAuth(){
  const res = verifyCode(document.getElementById("authInput").value, mode);
  if(res.ok){
    // 计数 +1（不限次数的码也记录，仅作统计）
    const u = getUsage(); u[res.code] = (u[res.code]||0)+1; setUsage(u);
    overlay.classList.remove("show");
    localStorage.setItem(STORAGE_KEY, JSON.stringify({testing:true, mode, code:res.code}));
    initQuiz();
  } else {
    document.getElementById("authErr").textContent = res.msg;
  }
}
document.getElementById("authInput").addEventListener("keydown", e=>{ if(e.key==="Enter") submitAuth(); });

/* ---------- 答题 ---------- */
function startTest(kind){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({pending:kind}));
  render();
}
function initQuiz(){
  const len = mode === "full" ? TOTAL : 96;
  answers = new Array(len).fill(null);
  cur = 0;
  renderQuiz();
}
function renderQuiz(){
  const len = answers.length;
  const q = TEXTS[cur];
  const pct = Math.round((cur / len) * 100);
  app.innerHTML = `
  <div class="card">
    <div class="quiz-head">
      <button class="back" onclick="goBack()">‹</button>
      <div style="flex:1">
        <div style="font-size:12px;color:var(--muted)">${mode==='full'?'完整版 200 题':'标准版 96 题'}</div>
        <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
      </div>
    </div>
    <div class="qmeta"><span>第 ${cur+1} / ${len} 题</span><span>${Math.round(pct)}%</span></div>
    <div class="qtext">${cur+1}. ${q[0]}</div>
    <button class="opt-btn ${answers[cur]==='a'?'sel':''}" onclick="pick('a')"><span class="key">A</span>${q[1]}</button>
    <button class="opt-btn ${answers[cur]==='b'?'sel':''}" onclick="pick('b')"><span class="key">B</span>${q[2]}</button>
    <div class="nav">
      <button class="btn ghost" style="flex:1" onclick="prev()">‹ 上一题</button>
      <button class="btn" style="flex:1" onclick="next()">下一题 ›</button>
    </div>
  </div>
  `;
  window.scrollTo(0,0);
}
function pick(choice){
  answers[cur] = choice;
  // 选中高亮一下再跳
  renderQuiz();
  setTimeout(()=>{ if(answers[cur]===choice && cur < answers.length-1) { cur++; renderQuiz(); } else if(cur === answers.length-1 && answers[cur]!==null){ /* 最后一题选完不自动提交 */ } }, 260);
}
function prev(){ if(cur>0){cur--;renderQuiz();} }
function next(){ if(cur < answers.length-1){cur++;renderQuiz();} else { finish(); } }
function goBack(){ if(confirm("退出测试将丢失当前进度，确定返回首页吗？")){ localStorage.removeItem(STORAGE_KEY); render(); } }

function finish(){
  // 检查是否全部作答
  if(answers.some(a=>a===null)){
    const idx = answers.findIndex(a=>a===null);
    alert("还有未作答的题目，请先完成第 " + (idx+1) + " 题");
    cur = idx; renderQuiz(); return;
  }
  const dim = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  answers.forEach((c,i)=>{ const L = QUESTIONS[i][c]; dim[L]++; });
  const type =
    (dim.E >= dim.I ? "E" : "I") +
    (dim.S >= dim.N ? "S" : "N") +
    (dim.T >= dim.F ? "T" : "F") +
    (dim.J >= dim.P ? "J" : "P");
  const result = {type, dim, mode, time: new Date().toLocaleString("zh-CN")};
  localStorage.setItem(STORAGE_KEY, JSON.stringify({result}));
  renderResult(result);
}

/* ---------- 结果页（丰富解读 + 成长建议 + 海报） ---------- */
const DNAME = {E:"外向",I:"内向",S:"感觉",N:"直觉",T:"思考",F:"情感",J:"判断",P:"知觉"};
const DIMCOLOR = {E:"#f59e0b",I:"#6366f1",S:"#10b981",N:"#8b5cf6",T:"#ef4444",F:"#ec4899",J:"#3b82f6",P:"#f97316"};

function renderResult(r){
  r_type_global = r.type; // 供 savePoster 下载文件名使用
  const t = TYPES[r.type];
  const d = r.dim;
  const pct = (a,b)=> Math.round(d[a]/(d[a]+d[b])*100);
  const strength = (a,b)=> { const v=pct(a,b); return v>=65?"明显偏好":v>=52?"中等偏好":"接近均衡"; };
  const bars = [
    {L:"E 外向", R:"I 内向", a:"E", b:"I", lv:pct("E","I"), rv:pct("I","E"), col:DIMCOLOR.E},
    {L:"S 感觉", R:"N 直觉", a:"S", b:"N", lv:pct("S","N"), rv:pct("N","S"), col:DIMCOLOR.S},
    {L:"T 思考", R:"F 情感", a:"T", b:"F", lv:pct("T","F"), rv:pct("F","T"), col:DIMCOLOR.T},
    {L:"J 判断", R:"P 知觉", a:"J", b:"P", lv:pct("J","P"), rv:pct("P","J"), col:DIMCOLOR.J},
  ];
  const letters = r.type.split("").map(x=>DNAME[x]);
  const dimsHtml = bars.map(b=>`
      <div class="row">
        <div class="lab"><span>${b.L} <b>${b.lv}%</b></span><span><b>${b.rv}%</b> ${b.R}</span></div>
        <div class="track">
          <div class="seg a" style="flex:${b.lv};background:${b.col}">${b.lv>8?b.L.split(" ")[0]:""}</div>
          <div class="seg b" style="flex:${b.rv}">${b.rv>8?b.R.split(" ")[0]:""}</div>
        </div>
      </div>`).join("");

  // 四个维度的偏好描述（结合本人得分）
  const dimDesc = {
    EI: r.type[0]==="E"
      ? `你在 <b>E 外向（${pct("E","I")}%）</b> 上得分较高，善于从人际互动、外部世界中汲取能量，表达和行动更外放。`
      : `你在 <b>I 内向（${pct("I","E")}%）</b> 上得分较高，更习惯向内 recharge，享受独处与深度思考。`,
    SN: r.type[1]==="S"
      ? `在认知方式上偏 <b>S 感觉（${pct("S","N")}%）</b>，你更看重具体事实、细节和可验证的经验。`
      : `在认知方式上偏 <b>N 直觉（${pct("N","S")}%）</b>，你更关注整体联系、可能性与长远趋势。`,
    TF: r.type[2]==="T"
      ? `决策时偏 <b>T 思考（${pct("T","F")}%）</b>，习惯用逻辑、客观标准权衡利弊。`
      : `决策时偏 <b>F 情感（${pct("F","T")}%）</b>，会更自然地把人和价值观纳入考量。`,
    JP: r.type[3]==="J"
      ? `生活方式偏 <b>J 判断（${pct("J","P")}%）</b>，喜欢计划、条理和确定性，倾向把事尽早定下来。`
      : `生活方式偏 <b>P 知觉（${pct("P","J")}%）</b>，更愿意保持开放、灵活应变，享受过程。`,
  };

  app.innerHTML = `
  <div class="card">
    <div class="result-type">
      <div class="code">${r.type}</div>
      <div class="name">${t.name}</div>
      <div class="role">${t.role}</div>
      <div class="chip-wrap" style="justify-content:center;margin-top:12px">
        ${r.type.split("").map((x,i)=>`<span class="chip" style="border-color:${DIMCOLOR[x]}">${x} · ${letters[i]}</span>`).join("")}
      </div>
    </div>

    <!-- 分享海报（先渲染，含保存按钮） -->
    <div id="posterRoot">${posterHtml(r, t, bars)}</div>
    <div class="share-row">
      <button class="btn ghost" onclick="restart()">再测一次</button>
      <button class="btn primary" onclick="savePoster()">📸 保存分享海报</button>
    </div>

    <div class="bars-title">四个维度分值</div>
    <div class="bars">${dimsHtml}</div>
    <div class="info-block">
      <h4>📊 偏好强弱解读</h4>
      <ul>
        ${bars.map(b=>`<li><b style="color:${b.col}">${b.L.split(" ")[0]}/${b.R.split(" ")[0]}</b>：${strength(b.a,b.b)}（${pct(b.a,b.b)}% / ${pct(b.b,b.a)}%）</li>`).join("")}
      </ul>
      <p style="margin-top:8px;font-size:12px;opacity:.85">${dimDesc.EI}${dimDesc.SN}${dimDesc.TF}${dimDesc.JP}</p>
    </div>

    <div class="info-block">
      <h4>🧭 类型整体解读</h4>
      <p>${t.overview}</p>
    </div>

    <div class="info-block">
      <h4>✨ 核心特质</h4>
      <div class="chip-wrap">${t.traits.map(x=>`<span class="chip">${x}</span>`).join("")}</div>
    </div>

    <div class="grid2">
      <div class="info-block">
        <h4>💪 天然优势</h4>
        <ul>${t.strengths.map(x=>`<li>${x}</li>`).join("")}</ul>
      </div>
      <div class="info-block">
        <h4>⚠️ 潜在短板</h4>
        <ul>${t.weaknesses.map(x=>`<li>${x}</li>`).join("")}</ul>
      </div>
    </div>

    <div class="info-block">
      <h4>👥 人际与沟通</h4>
      <p>${t.relation}</p>
    </div>

    <div class="info-block">
      <h4>💼 适合职业方向</h4>
      <ul>${t.career.map(x=>`<li>${x}</li>`).join("")}</ul>
    </div>

    <div class="info-block grow">
      <h4>🌱 成长建议</h4>
      ${t.growth.map(x=>`<p style="margin-bottom:8px">${x}</p>`).join("")}
    </div>

    <div class="share-row">
      <button class="btn ghost" onclick="restart()">再测一次</button>
      <button class="btn primary" onclick="window.scrollTo({top:0,behavior:'smooth'});savePoster();">📸 保存海报</button>
    </div>
    <div class="foot">完成于 ${r.time} · ${r.mode==='full'?'完整版 200 题':'标准版 96 题'}<br>性格类型没有好坏，只有不同 · 结果仅供参考</div>
  </div>
  `;
  window.scrollTo(0,0);
}

/* 生成海报 HTML（独立于页面，便于整张截图保存） */
function posterHtml(r, t, bars){
  const verTxt = r.mode==='full'?'完整版 · 200题':'标准版 · 96题';
  return `
  <div class="poster" id="poster">
    <div class="plogo">16Personalities · MBTI</div>
    <div class="pcode">${r.type}</div>
    <div class="pname">${t.name} · ${t.role}</div>
    <div class="prole">${r.type.split("").map(x=>DNAME[x]).join(" · ")}</div>
    <div class="pdim">
      ${r.type.split("").map(x=>`<span style="border:1px solid rgba(255,255,255,.3)">${x} ${DNAME[x]}</span>`).join("")}
    </div>
    <div class="pbars">
      ${bars.map(b=>`
        <div class="pbar">
          <span class="pl">${b.a}</span>
          <span class="pt"><i style="width:${b.lv}%;background:${b.col}"></i></span>
          <span class="pr">${b.b} ${b.lv}/${b.rv}</span>
        </div>`).join("")}
    </div>
    <div class="pfoot">四维偏好 · ${verTxt} · ${new Date().toLocaleDateString("zh-CN")}<br>性格类型没有好坏，只有不同</div>
  </div>`;
}

/* 保存海报：把海报节点绘制成图片并下载 */
function savePoster(){
  const node = document.getElementById("poster");
  if(!node){ alert("海报尚未生成"); return; }
  // 优先使用 SVG foreignObject 方案（无需第三方库）
  const w = node.offsetWidth, h = node.offsetHeight;
  const xml = new XMLSerializer().serializeToString(node);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">
    <foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml">${node.outerHTML}</div></foreignObject>
  </svg>`;
  const img = new Image();
  const svgBlob = new Blob([svg], {type:"image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(svgBlob);
  img.onload = ()=>{
    const canvas = document.createElement("canvas");
    const dpr = window.devicePixelRatio||1;
    canvas.width = w*dpr; canvas.height = h*dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr,dpr);
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob=>{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `MBTI_${r_type_global}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    }, "image/png");
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); alert("海报生成失败，可直接对上方海报卡片截图分享 📸"); };
  img.src = url;
}
let r_type_global = "";
function restart(){ localStorage.removeItem(STORAGE_KEY); render(); }
function showResult(r){ renderResult(r); }

render();
